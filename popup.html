<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: dark; }
    body { width: 268px; margin: 0; padding: 16px; background: #0f1115; color: #e8e8e6;
           font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; }
    h1 { font-size: 15px; margin: 0 0 2px; }
    .muted { color: #9aa0a6; font-size: 12px; margin: 0 0 14px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; }
    .status { display: flex; align-items: center; gap: 7px; font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
    .dot.on { background: #43c07a; }
    button { font: inherit; font-weight: 600; padding: 8px 12px; border-radius: 8px; border: 1px solid #3a4048;
             background: #262b33; color: #f2f2f0; cursor: pointer; width: 100%; }
    button.primary { background: #f4b860; border-color: #f4b860; color: #1a1206; }
    .switch { position: relative; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #3a4048; border-radius: 999px; transition: .15s; cursor: pointer; }
    .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
                      background: #e8e8e6; border-radius: 50%; transition: .15s; }
    input:checked + .slider { background: #f4b860; }
    input:checked + .slider::before { transform: translateX(18px); background: #1a1206; }
  </style>
</head>
<body>
  <h1>Stretchtext</h1>
  <p class="muted">Alt+Click a word, or select text and hit Stretch.</p>

  <div class="row">
    <span>Enabled on pages</span>
    <label class="switch"><input type="checkbox" id="enabled" /><span class="slider"></span></label>
  </div>

  <div class="row">
    <span class="status"><span class="dot" id="dot"></span><span id="statusText">Loading…</span></span>
  </div>

  <button id="open" class="primary">Open settings</button>
  <script src="popup.js"></script>
</body>
</html>
